services:
  siem-log-generator:
    build:
      context: .
      dockerfile: Dockerfile
    image: siem-log-generator:local
    ports:
      # Loopback only: no authentication, and the API returns HEC tokens.
      - "127.0.0.1:${LOG_GENERATOR_PORT:-5002}:5002"
      # LAN access on a trusted network: use this line instead.
      #- "${LOG_GENERATOR_PORT:-5002}:5002"
    environment:
      LOG_GENERATOR_STATE_DIR: /data
    volumes:
      - siem-log-generator-state:/data
      # File destinations write inside the container and are lost when it is
      # recreated. To keep them on the host, create ./output first, uncomment
      # this line, and use /output/<name>.log as the destination path.
      #- ./output:/output
    # Reaching a service on this machine (an SC4S or Splunk container that
    # publishes its port, for example): use host.docker.internal as the
    # destination host. Docker Desktop resolves it already; Docker on Linux
    # needs this line. Podman provides host.containers.internal instead.
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:5002/', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  siem-log-generator-state:
