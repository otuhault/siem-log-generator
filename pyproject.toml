[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "siem-log-generator"
version = "2.0.0"
description = "Flask web application that generates synthetic SIEM logs and ships them to file, Splunk HEC or syslog."
requires-python = ">=3.9"
dependencies = [
    "Flask>=3.0.0",
    "requests>=2.31.0",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["TAs", "venv", ".venv", "__pycache__", ".git"]
