## OPTIONAL — only needed to put account management into the Change datamodel.
## The add-on tags auditd `os unix resource file`, which grants no CIM dataset;
## Change needs `change`, and no shipped eventtype provides it for this data.

[auditd_account_management]
search = sourcetype=auditd type IN (ADD_USER, DEL_USER, USER_MGMT, ADD_GROUP, DEL_GROUP, GRP_MGMT)
