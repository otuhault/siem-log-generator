## CIM aliases for the supported auditd sourcetype.
## Ported from the retired [linux_audit] stanza in default/props.conf, which sits
## inside the BEGIN/END "SCRIPTED INPUT CONTENT IMPORTED FROM TA-deployment-apps"
## block and therefore must not be built on.

[auditd]

## Host
FIELDALIAS-dest_for_auditd = hostname AS dest
FIELDALIAS-dvc_for_auditd  = hostname AS dvc

## Account. Which field names the user depends on the record type, exactly as
## default/props.conf does it for [linux_audit].
EVAL-user      = case(type=="USER_AUTH", acct, type IN("USER_CMD","ADD_USER","DEL_USER","USER_MGMT","ADD_GROUP","DEL_GROUP","GRP_MGMT"), coalesce(acct, id), true(), uid)
EVAL-user_name = user
EVAL-src_user      = auid
EVAL-src_user_name = auid

## Outcome. auditd writes res=success|failed; CIM wants failure.
EVAL-status = if(res=="failed", "failure", res)

## Change datamodel attributes
EVAL-change_type = "AAA"
EVAL-object      = coalesce(grp, id, acct)

## Product
EVAL-vendor_product = "nix"
EVAL-app            = "nix"

## op -> action, object_category. Reuses the lookup the add-on already ships.
LOOKUP-action_for_auditd = nix_linux_audit_action_lookup op OUTPUT action, object_category

## command= from exe=
REPORT-command_for_auditd = command_for_auditd
